server:
  port: 9205

spring:
  application:
    name: file-service
  # 配置文件导入，从Nacos远程拉取公共配置
  config:
    import:
      # 可选导入Nacos数据源公共配置，找不到不启动报错
      - optional:nacos:common-datasource.yaml
      # 可选导入Nacos Redis公共配置，找不到不启动报错
      - optional:nacos:common-redis.yaml

  # Spring Cloud Nacos 配置与注册发现
  cloud:
    nacos:
      # Nacos 远程配置中心配置
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: dev
      # Nacos服务注册/发现配置
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}

  # 文件上传大小限制（覆盖 Boot 默认 1MB）
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

# MyBatis-Plus 持久层框架配置
mybatis-plus:
  configuration:
    # 开启数据库下划线字段自动映射实体类驼峰属性（user_name -> userName）
    map-underscore-to-camel-case: true
    # SQL日志输出实现，使用Slf4j统一日志框架打印执行SQL
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 对象存储（MinIO 默认，凭据走环境变量注入，禁止硬编码）
finaudit:
  oss:
    enabled: true
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin123}
    default-bucket: ${MINIO_BUCKET:finaudit-file}
  swagger:
    enabled: true
    title: file-service API
    description: 纯文件资源服务：上传 / 下载 / 预览
    version: 0.1.0

# 日志级别配置
logging:
  level:
    com.finaudit: info
