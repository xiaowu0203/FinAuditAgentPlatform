server:
  port: 9201

spring:
  application:
    name: agent-core-service
  # 配置文件导入，从Nacos远程拉取公共配置
  config:
    import:
      # 可选导入Nacos数据源公共配置，找不到不启动报错
      - optional:nacos:common-datasource.yaml
      # 可选导入Nacos Redis公共配置，找不到不启动报错
      - optional:nacos:common-redis.yaml
      # 可选导入Nacos 模型Key公共配置，找不到不启动报错
      - optional:nacos:common-model-keys.properties

  # Spring Cloud Nacos 配置与注册发现
  cloud:
    nacos:
      # Nacos 远程配置中心配置
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        namespace: dev
      # Nacos服务注册/发现配置
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}

  # RabbitMQ消息队列连接配置
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    # publisher confirm（P3.8 R7-8）：correlated 让每次发送带 CorrelationData，
    # 未被 broker 确认（nack/超时）时由 RabbitTemplate 回调告警——
    # 否则「以为发出去了、其实没到」只能靠任务卡住来发现
    publisher-confirm-type: correlated
    # mandatory + returns：消息无法路由（交换机在但队列/绑定缺失）时回调告警，而不是静默丢弃
    publisher-returns: true
    # 消息消费者监听配置
    listener:
      simple:
        # 消费者初始并发线程数
        concurrency: 1
        # 消费者最大并发线程数
        max-concurrency: 1
        # 消息确认模式：auto自动ACK，消息处理完成自动告知MQ删除消息
        acknowledge-mode: auto
        # 消费失败是否重新入队：false 失败直接丢弃，不重复消费
        default-requeue-rejected: false
        # 消费失败限次重试（P3.8 R7-8）：此前消费抛异常会直接进 DLQ，无退避、
        # 也无法区分「瞬时故障」与「必然失败」；现改为最多 3 次、指数退避
        # （1s → 2s → 4s，上限 10s），仍失败才进 DLQ 由告警消费者登记
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

# MyBatis-Plus 持久层框架配置
mybatis-plus:
  configuration:
    # 开启数据库下划线字段自动映射实体类驼峰属性（user_name -> userName）
    map-underscore-to-camel-case: true
    # SQL日志输出实现，使用Slf4j统一日志框架打印执行SQL
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# P2c 规则配置：租户级 Nacos 配置操作参数 + 管理员白名单
# namespace 须与 spring.cloud.nacos.config.namespace（dev）一致，否则发布/订阅看不到同一份配置
finaudit:
  nacos-config:
    core-addr: http://127.0.0.1:8848
    console-addr: http://127.0.0.1:8080
    username: ${NACOS_USERNAME}
    password: ${NACOS_PASSWORD}
    group: DEFAULT_GROUP
    namespace: dev
    rule-data-id: finaudit-rules-{tenantId}
    cache-ttl-seconds: 60
  agent:
    # 任务级执行预算（分钟，P3.5d）：单次执行（含修改重跑，started_at 刷新计时）超过即强制失败终止，
    # 防重试风暴/极端慢步骤长期占用任务与 MQ 消费线程；<=0 关闭检查
    task-timeout-minutes: 30
  admin:
    # 规则配置管理兜底白名单（主防线为类级 @RequirePerm("rule:manage") 权限码，P3.5 起；
    # 此处保留作内部直连场景的第二道防线）
    user-ids: [1]

# 日志级别配置
logging:
  level:
    com.finaudit: info
